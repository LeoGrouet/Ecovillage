services:

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    ports:
      - "4000:4000"
    volumes:
      - ./api-ecovillage:/usr/src/app

  database:
    image: postgis/postgis:13-master
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 3001:5432
    environment:
      POSTGRES_USER: 'ecovillage'
      POSTGRES_PASSWORD: 'passw0rd'
      POSTGRES_DB: 'ecovillage'
      ALLOW_IP_RANGE: 0.0.0.0/0
    restart: unless-stopped


volumes:
  postgres-data:
